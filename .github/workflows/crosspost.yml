name: Bluesky → Mastodon Crossposter

on:
  schedule:
    - cron: "*/10 * * * *"    # every 10 minutes
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Fetch limit (1..100). If empty, uses repository variable or default."
        required: false
        default: ""
      dry_run:
        description: "Set to 'true' for dry-run (no posting, no state changes)."
        required: false
        default: ""
      verbose:
        description: "Set to 'true' for verbose logs."
        required: false
        default: ""
      require_images:
        description: "Set to 'true' to post only when images are present (prevents link-only card posts)."
        required: false
        default: ""
      bluesky_filter:
        description: "Bluesky 'filter' (e.g., posts_with_media, posts_no_replies, posts_with_video)."
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  crosspost:
    runs-on: ubuntu-latest
    env:
      # Required (Secrets)
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

      # Optional (Inputs → Repo vars → defaults)
      FETCH_LIMIT: ${{ github.event.inputs.fetch_limit || vars.FETCH_LIMIT || '20' }}
      MASTODON_VISIBILITY: ${{ vars.MASTODON_VISIBILITY || 'public' }}
      MASTODON_MAX_CHARS: ${{ vars.MASTODON_MAX_CHARS || '500' }}

      # New: filter/guards & runtime flags
      BLUESKY_FILTER: ${{ github.event.inputs.bluesky_filter || vars.BLUESKY_FILTER || 'posts_with_media' }}
      REQUIRE_IMAGES: ${{ github.event.inputs.require_images || vars.REQUIRE_IMAGES || 'true' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
      VERBOSE: ${{ github.event.inputs.verbose || vars.VERBOSE || 'false' }}

      STATE_FILE: sync_state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: bsky-masto-state-${{ runner.os }}-${{ github.ref_name }}-
          restore-keys: |
            bsky-masto-state-${{ runner.os }}-${{ github.ref_name }}-
            bsky-masto-state-${{ runner.os }}-
            bsky-masto-state-

      - name: Initialize state file if missing
        run: |
          test -f "${STATE_FILE}" || echo '{"synced_uris":[]}' > "${STATE_FILE}"

      - name: Run crossposter
        run: |
          # CLI flags not needed; env DRY_RUN/VERBOSE/REQUIRE_IMAGES/BLUESKY_FILTER are picked up by the script.
          python bsky_to_masto.py

      - name: Save state cache
        if: ${{ always() && env.DRY_RUN != 'true' && env.DRY_RUN != '1' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: bsky-masto-state-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles(env.STATE_FILE) }}

      - name: Summary
        if: always()
        run: |
          echo "Run complete on $(date -u '+%Y-%m-%d %H:%M:%SZ')." >> $GITHUB_STEP_SUMMARY
          echo "Dry-run: $DRY_RUN  |  Verbose: $VERBOSE  |  Require images: $REQUIRE_IMAGES  |  Filter: $BLUESKY_FILTER" >> $GITHUB_STEP_SUMMARY
